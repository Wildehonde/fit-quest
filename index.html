<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit Quest">
<title>Fit Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Top bar: level + XP -->
<header id="topbar">
  <div class="brand">FIT<span>QUEST</span></div>
  <div id="levelbox"></div>
</header>

<main id="view"></main>

<!-- Bottom navigation (hidden during onboarding) -->
<nav id="nav">
  <button data-tab="card">🃏<span>Card</span></button>
  <button data-tab="checkin">✅<span>Check-in</span></button>
  <button data-tab="challenge">🔥<span>Iron 75</span></button>
  <button data-tab="badges">🏅<span>Badges</span></button>
  <button data-tab="history">📈<span>History</span></button>
  <button data-tab="settings">⚙️<span>Setup</span></button>
</nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
